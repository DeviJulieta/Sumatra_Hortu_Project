        <style>
       
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }


        /* TERRABARU HEADER */

        #dashboardHeader {
            width: 100%;
            height: 72px;
            flex: 0 0 72px;
            box-sizing: border-box;

            display: flex;
            align-items: center;
            gap: 22px;

            padding: 8px 24px;
            background: #174631;
            border-bottom: 3px solid #a9c99b;
        }

        .headerTitle h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.6px;
            color: #ffffff;
        }

        .headerTitle p {
            margin: 4px 0 0;
            font-size: 12px;
            color: #d9e9de;
        }


        /* MAP */
        #map {
            width: 100%;
            height: auto;
            flex: 1 1 auto;
            min-height: 0;
        }

        
/* DATA SECTION */
#dataPanel {
    width: 100%;
    height: 35vh;
    flex: 0 0 35vh;
    box-sizing: border-box;
    min-height: 0;


    display: grid;
    grid-template-columns: minmax(270px, 0.8fr) minmax(0, 1.2fr);
    gap: 12px;
    overflow: hidden;
}

/* CHART PANEL */
#chartPanel {
    min-width: 0;
    min-height: 0;
    background: white;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 10px 12px;

    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
}

.chart-heading h3 {
    margin: 0;
    font-size: 16px;
}

#chartSubtitle {
    font-size: 12px;
    color: #666;
    margin-top: 3px;
}

#top10Chart {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 5px;
}

.chart-item {
    margin-bottom: 8px;
}

.chart-label {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 3px;
    font-size: 11px;
}

.chart-label span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.chart-track {
    width: 100%;
    height: 10px;
    background: #eeeeee;
    border-radius: 5px;
    overflow: hidden;
}

.chart-bar {
    height: 100%;
    background: #27834e;
    border-radius: 5px;
}

/* TABLE PANEL */
    #tablePanel {
        width: auto;
        height: 100%;
        min-width: 0;
        min-height: 0;
        box-sizing: border-box;
        padding: 10px 12px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 6px;

        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow: hidden;
    }

    .table-scroll {
        flex: 1;
        min-height: 0;
        overflow: auto;
    }

    /* SMALL SCREENS */
    @media (max-width: 800px) {
        #map {
            height: 55vh;
        }

        #dataPanel {
            height: auto;
            min-height: 600px;
            grid-template-columns: 1fr;
            grid-template-rows: 260px minmax(350px, 1fr);
        }
    }


        .table-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        #tableTitle {
            margin: 0;
            font-size: 18px;
        }

        .table-actions {
            display: flex;
            gap: 8px;
        }

        #districtSearch,
        #exportCSV {
            padding: 7px 10px;
        }

        .table-scroll {
            flex: 1;
            overflow: auto;
        }

        #districtTable {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
            font-size: 13px;
        }

        #districtTable th,
        #districtTable td {
            padding: 9px 12px;
            border: 1px solid #ddd;
            text-align: right;
        }

        #districtTable th:first-child,
        #districtTable td:first-child {
            text-align: left;
        }

        #districtTable th {
            position: sticky;
            top: 0;
            background: #e9f0e9;
            z-index: 1;
        }

        /* =====================================
        GLOBAL FONT - FIGTREE
        ===================================== */

        body {
            font-family: 'Figtree', sans-serif;
        }

        button,
        input,
        select,
        textarea {
            font-family: 'Figtree', sans-serif;
        }

        .leaflet-container {
            font-family: 'Figtree', sans-serif;
        }

        .leaflet-popup-content,
        .leaflet-tooltip {
            font-family: 'Figtree', sans-serif;
        }

        /* Dashboard headings and content */

        #dashboardHeader,
        #dashboardHeader *,
        #dataPanel,
        #dataPanel * {
            font-family: 'Figtree', sans-serif;
        }

         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');

             }
         }
         return tempDiv.innerHTML;

            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
